name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Prepara PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
          tools: composer:v2

      - name: Valida composer.json
        run: composer validate --strict

      # Niente composer.lock in repo (è una libreria): si risolve al volo,
      # così un aggiornamento rotto a monte si vede subito invece che fra mesi.
      - name: Installa le dipendenze
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Syntax check di ogni file PHP
        run: find ai-seo-engine tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Test
        if: '!cancelled()'
        run: vendor/bin/phpunit --display-warnings --display-notices

      # I tre controlli girano sempre, anche se uno prima ha fallito: un solo
      # run deve mostrare tutti i problemi, non il primo e basta.
      - name: Stile del codice
        if: '!cancelled()'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      # Livello 8 e bloccante. Il debito non tipizzato della v1 è circoscritto a
      # GeminiSEO.php tramite ignoreErrors in phpstan.neon: tutto il codice
      # nuovo è analizzato per intero, e quando la Fase 2 riscriverà quel file
      # le eccezioni spariranno con lui.
      - name: Analisi statica
        if: '!cancelled()'
        run: vendor/bin/phpstan analyse --no-progress --error-format=github
